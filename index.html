<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fish Arena</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<section id="auth-screen" class="screen"><div class="panel auth-panel"><div class="logo">🐟 FISH ARENA</div><p>Eat. Grow. Evolve.</p><form id="auth-form"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="6" required><div class="auth-actions"><button type="submit">Sign in</button><button type="button" class="secondary" id="signup-btn">Create account</button></div></form><button id="guest-btn" class="ghost">Play as guest</button><p id="auth-status" class="status"></p></div></section>
<section id="menu-screen" class="screen hidden"><div class="panel menu-panel"><div class="topline"><div class="logo">🐟 FISH ARENA</div><button id="signout-btn" class="ghost">Sign out</button></div><h1>Rule the reef.</h1><p id="welcome"></p><div class="menu-grid"><button id="play-btn" class="big-button">🌊 Play</button><button id="host-btn" class="big-button secondary">👑 Host</button><button id="join-btn" class="big-button secondary">🔗 Join</button></div><div class="skins"><h2>Skins</h2><div id="skin-list" class="skin-list"></div></div><div class="stats"><span>Best <b id="best-size">1.0</b></span><span>Eaten <b id="best-eaten">0</b></span></div><p id="room-status" class="status"></p></div></section>
<section id="game-screen" class="hidden game-screen"><canvas id="game"></canvas><div class="hud"><div class="hud-card"><b id="size-label">1.0</b><small>SIZE</small></div><div class="hud-card"><b id="score-label">0</b><small>EATEN</small></div><div id="evo-label" class="hud-card"><b>FRY</b><small>EVOLUTION</small></div><button id="leave-btn" class="hud-button">×</button></div><div id="room-code" class="room-code hidden"></div><div id="game-tip" class="game-tip">Use the joystick to swim</div><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><button id="boost-btn" class="boost">BOOST</button><div id="evolution" class="evolution hidden"><b>EVOLUTION!</b><span id="evo-name"></span></div></section>
</main><script type="module" src="app.js"></script></body></html>
