<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote Fish Arena Device</title>
  <style>
    html,body{margin:0;height:100%;background:#111827;color:#fff;font:14px system-ui}
    #status{position:fixed;z-index:10;top:10px;left:10px;padding:8px 12px;border-radius:8px;background:#111827cc}
  </style>
</head>
<body>
  <div id="status">Connecting to remote device…</div>
  <script type="module">
    import RFB from './core/rfb.js';
    const status=document.getElementById('status');
    const target=document.createElement('div');
    target.style.cssText='position:fixed;inset:0';
    document.body.appendChild(target);
    const scheme=location.protocol==='https:'?'wss':'ws';
    const rfb=new RFB(target,scheme+'://'+location.host+'/websockify');
    rfb.scaleViewport=true;
    rfb.resizeSession=false;
    rfb.viewOnly=false;
    rfb.showDotCursor=true;
    rfb.addEventListener('connect',()=>status.textContent='Connected to Remote Fish Arena Device');
    rfb.addEventListener('disconnect',()=>status.textContent='Disconnected — reload to reconnect');
    rfb.addEventListener('credentialsrequired',()=>{
      const p=prompt('VNC password');
      if(p!==null)rfb.sendCredentials({password:p});
    });
  </script>
</body>
</html>
